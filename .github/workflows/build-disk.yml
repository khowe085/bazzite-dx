---
# Builds a live installer ISO the way Bazzite builds its own (.github/workflows/build_iso.yml in
# ublue-os/bazzite): a live Bazzite session with Anaconda, made from installer/, that installs this
# image. The file keeps its old name so the workflow can be run from a branch before it is merged:
# GitHub only offers "Run workflow" for files that exist on the default branch.
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to install, e.g. pr-7 for a pull request's build"
        required: false
        default: latest
        type: string

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  # The session the installer runs in, as on Bazzite's own KDE ISO.
  LIVE_IMAGE: "ghcr.io/ublue-os/bazzite:stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      # As Bazzite's workflow does: container storage on a zstd-compressed Btrfs loopback.
      - name: Put container storage on a Btrfs loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the installer image
        env:
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          # The installer's hooks find the image to install with `podman images 'bazzite*'`. Under any
          # other name the ISO would still build, with an empty image reference in its kickstart.
          if [[ ${IMAGE_NAME,,} != bazzite* ]]; then
            echo "::error::installer/ only finds an image whose name starts with bazzite, not ${IMAGE_NAME}"
            exit 1
          fi
          # image-files: the flatpaks in the image's preinstall.d go onto the ISO as well, read from
          # this checkout, so run the workflow from the ref the tag was built from. Any the ISO lacks,
          # the installed image adds at a boot with network.
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${LIVE_IMAGE}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${TAG}" \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            --build-context image-files=system_files \
            -t localhost/payload:latest installer/

      # Bazzite's ISO workflow uses this branch of titanoboa, ublue's live ISO builder, pinned here.
      # A bare file name, as Bazzite passes: the action resolves iso-dest from its own directory and
      # needs every directory in it to exist, so the ISO is moved to upload/ in the next step.
      - name: Build the ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a # revamp-pr
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ env.IMAGE_NAME }}-${{ inputs.tag || 'latest' }}-amd64.iso

      - name: Move the ISO to upload/ with its checksum
        shell: bash
        env:
          ISO_PATH: ${{ steps.build.outputs.iso-dest }}
        run: |
          mkdir -p upload
          mv "$ISO_PATH" upload/
          cd upload
          iso="$(basename "$ISO_PATH")"
          sha256sum "$iso" | tee "$iso-CHECKSUM"

      - name: Upload the ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso
          path: upload/
          if-no-files-found: error
          compression-level: 0
