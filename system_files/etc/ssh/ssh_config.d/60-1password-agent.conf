# SSH keys live in 1Password, so use its agent, as 1Password's SSH docs describe for ~/.ssh/config.
#
# IdentityAgent outranks SSH_AUTH_SOCK, so it is only applied where 1Password can actually answer:
#  - not when connected over SSH, where a forwarded agent has to keep working. 1Password documents
#    `Match host * exec "test -z $SSH_TTY"` for this; SSH_CONNECTION covers the same case plus remote
#    commands and editors that run without a TTY.
#  - not when 1Password's agent socket is absent (agent off, other accounts, root), so whatever
#    agent the session already has stays in charge.
# A user's own ~/.ssh/config is read first and wins.
Match host * exec "test -z \"$SSH_CONNECTION\" && test -S \"%d/.1password/agent.sock\""
  IdentityAgent ~/.1password/agent.sock
