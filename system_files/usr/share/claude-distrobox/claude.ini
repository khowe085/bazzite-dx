
# A general-purpose Ubuntu box, named like the one in the base's distrobox.ini, that comes with Claude
# Desktop (Anthropic's official Debian/Ubuntu build) installed and exported. Created at first login
# by /usr/libexec/claude-distrobox-setup; by hand: ujust setup-distrobox-app ubuntu
[ubuntu]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
pull=true
additional_packages="curl gnupg ca-certificates"
init_hooks="/run/host/usr/libexec/claude-distrobox-init"
exported_apps="claude-desktop"
