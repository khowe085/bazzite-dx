
# Claude Desktop, Anthropic's official Debian/Ubuntu build, in an Ubuntu box. Created at first login
# by /usr/libexec/claude-distrobox-setup; by hand: ujust setup-distrobox-app claude
[claude]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
pull=true
additional_packages="curl gnupg ca-certificates"
init_hooks="/run/host/usr/libexec/claude-distrobox-init"
exported_apps="claude-desktop"
